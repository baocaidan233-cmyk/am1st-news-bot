notion:
  source_db_id: ""       # env: NOTION_SOURCE_DB_ID — RSS feed table (url + cookie + in_use)
  candidate_db_id: ""    # env: NOTION_CANDIDATE_DB_ID — "AM1ST-n8n-Channel" candidate pool, shared by ingestion + publish cycles
  hot_topics_db_id: ""    # env: NOTION_HOT_TOPICS_DB_ID — shared "AM1ST热点标记" table, manual breaking-news flag, see core/hot_topics.py
  alert_user_id: ""       # env: NOTION_ALERT_USER_ID — @mentioned on cookie/extraction failures
  # Source props confirmed against the live "rss_n8n_am1st_news" database 2026-08-03.
  # Candidate props confirmed against the original n8n export's node field lists 2026-08-04 — not yet verified against a live schema read, check before first run.
  source_props:
    in_use: "in_use"
    feed_url: "RSS"
    name: "Name"
    cookie: "cookie"
    domain: "website"
  candidate_props:
    title: "title"
    url: "url"
    author: "author"
    description: "description"
    published_at: "published_at"
    post_content: "post_content"
    llm_score: "llm_score"
    llm_comment: "llm_comment"
    content: "content"
    url_hash: "url_hash"
    send_status: "send_status"
    heat_score: "heat_score"
    event_first_seen_at: "event_first_seen_at"
    is_hot: "is_hot"
  hot_topics_props:
    name: "Name"
    channel: "Channel"
    active: "In_Use"

redis:
  key_prefix: "am1st:url_hash:"
  ttl_seconds: 864000  # 10 days

openai:
  chat_model: "gpt-4o-mini"  # Writer ONLY (published post prose) — kept 4o-mini, see core/config.py comment
  nano_model: "gpt-5-nano"  # Scorer + PriorityRanker + EventVerifier — every non-prose judgment call, see core/config.py comment
  embedding_model: "text-embedding-3-small"
  scoring_prompt_file: "prompts/scoring_prompt.txt"
  content_gen_prompt_file: "prompts/content_gen_prompt.txt"
  score_threshold: 5.0  # inclusive — score >= 5.0 passes

dedup:
  # 2026-09-01: raised 0.8 -> 0.85, live A/B test at Caidan's request. Real
  # data from logs/event_identity_decisions.jsonl (818 lines, pulled and
  # analyzed 2026-09-01) showed the 0.80-0.90 cosine band was NOT a safe
  # "definite duplicate" zone: 21/113 (~19%) of real pairs scoring there
  # were actually RELATED_DIFFERENT_EVENT, not the same occurrence — most
  # exposed on Layer 2 intra-batch clustering (main.py), which merges on
  # cosine alone with no entity/LLM check. Baseline snapshot before this
  # change: 1677 distinct event_ids / 2211 points in am1st_events. See
  # project_am1st_news_bot memory for the full ledger — do not revert this
  # without checking there first, an active review is in progress.
  semantic_threshold: 0.85  # cosine similarity, both intra-batch and cross-cycle layers

entity_verifier:
  hub_event_count_threshold: 2   # shared token only counts as evidence if it's been the core of fewer than this many past events
  pair_cooccur_max: 1            # two hub tokens together still count if this exact pair has co-occurred in at most this many past events
  min_doc_freq_for_core: 2       # a token needs >=this many of an event's own articles to join its persisted core_entities
  hub_key_prefix: "am1st:hub:"
  same_event_prompt_file: "prompts/same_event_prompt.txt"
  update_subtype_prompt_file: "prompts/update_subtype_prompt.txt"
  related_event_prompt_file: "prompts/related_event_prompt.txt"
  log_path: "logs/event_identity_decisions.jsonl"
  top_k: 5  # verify up to this many historical event candidates, not just the top-1 cosine match — see core/config.py
  subtype_restatement_weight: 0.2
  subtype_corroboration_weight: 1.0
  subtype_core_update_weight: 1.5
  weighted_overlap_threshold: 0.15  # IDF-weighted keyword overlap floor for the FAIL_OPEN branch (2026-08-20, ported from North_Korea_News — not yet independently validated on am1st_events data)

hot_topics:
  channel_name: "AM1ST"      # this bot's own tag in the shared Notion table's Channel multi-select column
  match_threshold: 0.5       # cosine floor for "this candidate is about a currently-flagged hot topic" — calibrated 2026-08-31 via live embedding tests (see core/config.py), still not independently validated against real am1st_events data
  ttl_hours: 24               # both the Notion flag's own freshness window and how long a matched event stays "hot"
  fast_poll_seconds: 180      # main_publish.py's short-poll interval while an unpublished is_hot candidate exists

heat:
  related_threshold: 0.6      # cosine floor for "same event, different source" — below dedup.semantic_threshold
  window_hours: 240           # 10 days — matches redis.ttl_seconds' convention, wider than qdrant.cross_cycle_window_hours (72h) so multi-day events don't fragment
  major_outlets:
    - "Reuters"
    - "Financial Times"
    - "Wall Street Journal"
    - "CNN"
    - "CBS"
    - "Fox News"
    - "New York Post"
    - "Just The News"
  major_outlet_weight: 2.0    # vs 1.0 for any other corroborating source

qdrant:
  collection: "am1st_embeddings"           # ingestion-side cross-cycle dedup cache (title+description)
  posted_collection: "am1st_posting_news_embedding"  # publish-side "already posted" cache (post_content)
  events_collection: "am1st_events"        # event aggregation — groups of points per underlying event, see HeatConfig/EventStore
  cross_cycle_window_hours: 72
  cleanup_retention_days: 10  # for the separate, not-yet-built daily cleanup job
  timeout_seconds: 15  # AsyncQdrantClient has no timeout by default — real hang observed 2026-08-11

extraction:
  timeout_seconds: 20
  min_text_length: 200

gettr:
  api_url: "https://gettr.com/api/u/post"

publish:
  interval_seconds: 1800       # 30 minutes
  candidate_min_score: 5.0     # Notion query floor (lower of weekday/weekend below)
  weekday_min_score: 6.0
  weekend_min_score: 5.0
  candidate_max_age_hours: 12
  fresh_hours: 4
  batch_min: 3
  batch_max: 10
  priority_rank_prompt_file: "prompts/priority_rank_prompt.txt"
  posted_dedup_window_hours: 240  # was 24h — widened 2026-08-07, matches heat.window_hours (10 days)
  posted_dedup_threshold: 0.70  # stricter than ingestion's 0.8 — deliberate, fully-autonomous posting errs toward under-posting

max_publish_age_hours: 3
poll_interval_seconds: 600  # 10 minutes, matches the original n8n cadence
cycle_timeout_seconds: 540  # 9 min — real n8n cycles ran ~5min, almost never past 7min; hard-cuts a stuck cycle so the next one always starts on schedule
alert_cooldown_seconds: 21600  # 6h — don't re-@mention for a still-broken source every cycle
